server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/game}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    # CWE-778: ensure all application security events are captured at INFO or above
    ru.vitrailclinic: INFO
  file:
    # CWE-778: persist logs to a file so security events survive process restarts
    name: logs/app.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB
