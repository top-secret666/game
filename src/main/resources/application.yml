server:
  port: 8080
  # CWE-209 / OWASP A05 fix: never expose internal details via the /error endpoint
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    # CWE-778: ensure all application security events are captured at INFO or above
    ru.vitrailclinic: INFO
  file:
    # CWE-778: persist logs to a file so security events survive process restarts
    name: logs/app.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

# CWE-798 fix: credentials are never hardcoded — loaded from environment variables only.
# Set DEV_USERNAME (default: dev) and DEV_PASSWORD in your shell or .env before starting.
# Example:
#   export DEV_USERNAME=dev
#   export DEV_PASSWORD=your-strong-secret
security:
  dev:
    username: ${DEV_USERNAME:dev}
    password: ${DEV_PASSWORD}
