# Test profile
# Overrides the ${DB_USERNAME} / ${DB_PASSWORD} placeholders from application.yml
# so the property environment resolves cleanly.
# The actual datasource URL, username, and password are replaced at runtime by
# Testcontainers @ServiceConnection — these placeholder values are never used.
spring:
  datasource:
    username: test
    password: test
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    ru.vitrailclinic: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
