# ──────────────────────────────────────────────────────────────
# CI Workflow  –  runs on every push and pull request
#
# Jobs:
#   1. build-test  → compile + unit tests on a real Postgres
#   2. docker-build → build the image + push to GHCR
#      (only on pushes to main / release branches)
# ──────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY:    ghcr.io
  IMAGE_NAME:  ${{ github.repository }}   # e.g. username/game-backend

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1 – Build & Test
  # ──────────────────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-22.04

    # Spin up a Postgres service container so Flyway + JPA tests work
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       game_test
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d game_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven        # caches ~/.m2 between runs

      # Full build + tests; Spring Boot connects via env vars
      - name: Build and run tests
        env:
          DB_URL:       jdbc:postgresql://localhost:5432/game_test
          DB_USERNAME:  test_user
          DB_PASSWORD:  test_pass
        run: mvn verify --batch-mode --no-transfer-progress

      # Upload surefire report as an artifact for easy inspection
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 2 – Build Docker image & push to GHCR
  # Only runs on pushes (not PRs) so we never push from forks.
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-22.04
    needs: build-test                   # only if tests pass
    if: github.event_name == 'push'     # skip on pull_request events

    permissions:
      contents: read
      packages: write     # required to push to GHCR

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Extract metadata (tags + labels) from Git ref
      # Produces tags like:  latest, 0.1.0, sha-abc1234
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-provided, no setup needed

      # BuildKit cache speeds up subsequent builds significantly
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context:     .
          push:        true
          tags:        ${{ steps.meta.outputs.tags }}
          labels:      ${{ steps.meta.outputs.labels }}
          cache-from:  type=gha
          cache-to:    type=gha,mode=max
          # Pass build args if needed, e.g.:
          # build-args: |
          #   APP_VERSION=${{ github.ref_name }}
